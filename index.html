<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d28">
<meta name="description" content="ระบบ Dashboard KPI องค์การบริหารส่วนจังหวัดสมุทรสาคร">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src https://script.google.com https://script.googleusercontent.com https://*.googleusercontent.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Dashboard KPI อบจ.สมุทรสาคร</title>
<style>
:root{font-family:"Sarabun","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light;--g950:#062d1d;--g900:#0b3d28;--g700:#17613e;--g500:#248a58;--gold:#e7b84f;--ink:#eff9f3;--muted:#b8d1c2}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--g950)}body{position:relative;min-height:100dvh}
.app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f6f4;opacity:0;transition:opacity .32s ease}.app-frame.is-ready{opacity:1}
.loading-screen{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;color:var(--ink);background:radial-gradient(circle at 18% 16%,rgba(231,184,79,.16),transparent 31%),radial-gradient(circle at 84% 82%,rgba(56,170,108,.2),transparent 35%),linear-gradient(145deg,#061b12,var(--g900) 56%,#071f16);transition:opacity .32s ease,visibility .32s ease}
.loading-screen.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.loading-card{width:min(420px,100%);padding:30px 28px;border:1px solid rgba(255,255,255,.17);border-radius:28px;background:rgba(255,255,255,.075);box-shadow:0 28px 70px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.13);backdrop-filter:blur(18px);text-align:center}
.seal{width:80px;height:80px;display:grid;place-items:center;margin:0 auto 20px;border:1px solid rgba(231,184,79,.55);border-radius:50%;background:rgba(255,255,255,.09);box-shadow:0 16px 34px rgba(0,0,0,.21),0 0 0 7px rgba(255,255,255,.025)}
.seal:before{content:"KPI";width:58px;height:58px;display:grid;place-items:center;border-radius:50%;color:var(--g900);background:linear-gradient(145deg,#fff,#dcece2);box-shadow:inset 0 0 0 2px rgba(23,97,62,.12);font-size:17px;font-weight:800;letter-spacing:.08em}
h1{margin:0;font-size:clamp(20px,4vw,27px);line-height:1.35}p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
.progress{position:relative;height:6px;overflow:hidden;margin-top:24px;border-radius:999px;background:rgba(255,255,255,.1)}.progress:after{content:"";position:absolute;inset:0;width:42%;border-radius:inherit;background:linear-gradient(90deg,var(--g500),var(--gold));animation:loading 1.25s ease-in-out infinite}
.fallback{display:none;margin-top:22px}.fallback.is-visible{display:block}.fallback a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 18px;border:1px solid rgba(255,255,255,.22);border-radius:999px;color:#fff;background:linear-gradient(110deg,var(--g700),var(--g500));box-shadow:0 10px 24px rgba(0,0,0,.18);font-size:13px;font-weight:700;text-decoration:none}.fallback a:focus-visible{outline:3px solid rgba(231,184,79,.65);outline-offset:3px}
@keyframes loading{from{transform:translateX(-120%)}to{transform:translateX(340%)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="loading-screen" class="loading-screen" aria-live="polite"><section class="loading-card"><div class="seal" aria-hidden="true"></div><h1>Dashboard KPI อบจ.สมุทรสาคร</h1><p id="loading-message">กำลังเชื่อมต่อระบบ กรุณารอสักครู่</p><div class="progress" aria-hidden="true"></div><div id="fallback" class="fallback"><p>หากระบบไม่แสดง สามารถเปิด Web App โดยตรงได้</p><a id="direct-link" href="#" target="_blank" rel="noopener noreferrer">เปิดระบบโดยตรง</a></div></section></main>
<iframe id="dashboard-frame" class="app-frame" title="ระบบ Dashboard KPI อบจ.สมุทรสาคร" referrerpolicy="strict-origin-when-cross-origin" sandbox="allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts" allow="fullscreen; clipboard-read; clipboard-write" allowfullscreen></iframe>
<noscript><div style="position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;color:#fff;background:#062d1d;text-align:center">กรุณาเปิดใช้งาน JavaScript เพื่อเข้าสู่ระบบ Dashboard</div></noscript>
<script>
(()=>{'use strict';
const APP_SCRIPT_URL='https://script.google.com/macros/s/AKfycbxr14wuFfaLZuEKsExgVOy2C17-NiDsaB5YtJIZmoPe3jd2zm0vJf6ItmVAmYZcbgjH/exec';
const frame=document.getElementById('dashboard-frame'),screen=document.getElementById('loading-screen'),message=document.getElementById('loading-message'),fallback=document.getElementById('fallback'),directLink=document.getElementById('direct-link');
function trustedUrl(){try{const url=new URL(APP_SCRIPT_URL),valid=/^\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url.pathname);if(url.protocol!=='https:'||url.hostname!=='script.google.com'||!valid)return'';url.searchParams.set('host','github-pages');if(new URLSearchParams(location.search).get('analyticsTest')==='1')url.searchParams.set('analyticsTest','1');return url.href}catch(error){return''}}
const url=trustedUrl();directLink.href=APP_SCRIPT_URL;
if(!url){message.textContent='การตั้งค่า Web App URL ไม่ถูกต้อง';fallback.classList.add('is-visible');return}
let ready=false;
function showApp(){if(ready)return;ready=true;frame.classList.add('is-ready');screen.classList.add('is-hidden')}
window.addEventListener('message',event=>{const trusted=/^https:\/\/(?:script\.google\.com|[a-z0-9.-]+\.googleusercontent\.com)$/.test(event.origin);if(trusted&&event.data&&event.data.type==='sk-dashboard-ready')showApp()});
frame.addEventListener('load',()=>{window.setTimeout(showApp,2500)},{once:true});
window.setTimeout(()=>{if(!ready){message.textContent='การเชื่อมต่อใช้เวลานานกว่าปกติ';fallback.classList.add('is-visible')}},12000);
frame.src=url;
})();
</script>
</body>
</html>
